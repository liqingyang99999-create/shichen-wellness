plugins { id 'com.android.application' }
android {
    namespace 'cn.shichen.wellness'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.shichen.wellness'
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
        // Keep the installed package/certificate while publishing a non-debuggable build.
        release { applicationIdSuffix '.preview'; signingConfig signingConfigs.debug; debuggable false; minifyEnabled false }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
